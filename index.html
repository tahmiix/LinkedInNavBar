<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavBar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <div class="logo-container">
            <img src="Llogo.png" alt="Logo" class="logo">
        </div>

       <div class="search-container">
            <input type="text" placeholder="Search..." class="search-bar">
        </div>
       <div class="icons-container">
         <div class="nav-item"> 
            <img src="home.png" alt="Home" class="home-icon">
            <span class="icon-label">Home</span>
         </div>
 
        <div class="nav-item"> 
            <img src="teamwork.png" alt="Teamwork" class="teamwork-icon">
            <span class="icon-label">Network</span>
        </div>

        <div class="nav-item"> 
            <img src="suitcase.png" alt="Suitcase" class="suitcase-icon">
            <span class="icon-label">Suitcase</span>
        </div>
        
        <div class="nav-item"> 
            <img src="chat.png" alt="chat" class="chat-icon">
            <span class="icon-label">Chat</span>
        </div>

        <div class="nav-item"> 
            <img src="notification.png" alt="Notifications" class="notifications-icon">
            <span class="icon-label">Notifications</span>
        </div>

        <div class="nav-item">
            <img src="user.png" alt="User" class="user-icon">
            <span class="icon-label">User</span>
        </div>

        <div class="nav-item">
              <span class="icon-line"><b>|</b></span>
         </div>

         <div class="nav-item">
             <img src="blocks.png" alt="Blocks" class="blocks-icon">
            <span class="icon-label">Business</span>
         </div>
    </div>
    </div>
</body>
</html>
